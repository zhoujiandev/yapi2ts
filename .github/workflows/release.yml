name: Publish Extension

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to publish (e.g., 1.0.0)'
                required: true
                type: string

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: latest

            - name: Extract version from tag
              id: get_version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    VERSION="${{ github.event.inputs.version }}"
                    echo "Using manual version: $VERSION"
                  else
                    VERSION=${GITHUB_REF#refs/tags/v}
                    echo "Extracted version from tag: $VERSION"
                  fi
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Validate version format
              run: |
                  VERSION=${{ steps.get_version.outputs.version }}
                  if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Error: Invalid version format '$VERSION'. Expected format: x.y.z"
                    exit 1
                  fi
                  echo "Version format is valid: $VERSION"

            - name: Pull latest changes
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git pull origin master --rebase

            - name: Update package.json version
              run: |
                  CURRENT_VERSION=$(node -p "require('./package.json').version")
                  TARGET_VERSION=${{ steps.get_version.outputs.version }}
                  if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
                    echo "Version is already $TARGET_VERSION, skipping update"
                  else
                    npm version $TARGET_VERSION --no-git-tag-version
                    echo "Updated package.json version from $CURRENT_VERSION to $TARGET_VERSION"
                  fi

            - name: Commit version update
              run: |
                  git add package.json
                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "chore: update version to ${{ steps.get_version.outputs.version }}"
                    git push origin HEAD:master
                  fi

            - name: Install dependencies
              run: pnpm install

            - name: Run linting and formatting checks
              run: |
                  echo "🔍 Running linting checks..."
                  pnpm run lint:check
                  echo "✅ Linting passed"

                  echo "🎨 Running format checks..."
                  pnpm run format:check
                  echo "✅ Format checks passed"

            - name: Build and compile extension
              run: |
                  echo "🔨 Compiling extension..."
                  pnpm run compile
                  echo "✅ Compilation successful"

                  echo "📦 Building production package..."
                  pnpm run package
                  echo "✅ Package build successful"

            - name: Setup virtual display for tests
              run: |
                  echo "🖥️ Setting up virtual display..."
                  sudo apt-get update
                  sudo apt-get install -y xvfb
                  echo "✅ Virtual display setup complete"

            - name: Compile tests
              run: |
                  echo "🔨 Compiling tests..."
                  pnpm run compile-tests
                  echo "✅ Tests compiled"

            - name: Run tests
              timeout-minutes: 10
              run: |
                  echo "🧪 Running tests..."
                  pnpm run test:ci
                  echo "✅ Tests passed"

            - name: Verify build output
              run: |
                  echo "🔍 Verifying build output..."
                  if [ ! -f "dist/extension.js" ]; then
                    echo "❌ Error: dist/extension.js not found"
                    exit 1
                  fi

                  echo "📊 Build output size:"
                  ls -lh dist/
                  echo "✅ Build verification passed"

            - name: Create VSIX package
              run: |
                  echo "📦 Creating VSIX package..."
                  npx @vscode/vsce package --no-dependencies

                  echo "📊 VSIX package info:"
                  ls -lh *.vsix
                  echo "✅ VSIX package created successfully"

            - name: Publish to VSCode Marketplace
              run: |
                  echo "🚀 Publishing to VSCode Marketplace..."
                  npx @vscode/vsce publish --packagePath *.vsix -p ${{ secrets.VSCE_TOKEN }}
                  echo "✅ Published to VSCode Marketplace"

            - name: Publish to Open VSX
              run: |
                  echo "🚀 Publishing to Open VSX..."
                  npx ovsx publish *.vsix -p ${{ secrets.OVSX_TOKEN }}
                  echo "✅ Published to Open VSX"

            - name: Upload VSIX as release asset
              uses: actions/upload-artifact@v4
              with:
                  name: vsix-package
                  path: '*.vsix'
                  retention-days: 90
